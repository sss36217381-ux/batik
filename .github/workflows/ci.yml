name: Laravel ERP Batik Madura CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build, Migrate & Automated Testing (PHP 8.2 & PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_batik_madura_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup PHP Runtime (8.2)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, pdo_sqlite, zip, bcmath, curl
          coverage: none

      - name: 3. Setup Node.js Runtime (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 4. Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 5. Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: 6. Install NPM Dependencies & Compile Vite Assets
        run: |
          npm ci || npm install
          npm run build

      - name: 7. Prepare Environment File & Application Key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: 8. Execute Database Migrations (PostgreSQL)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: erp_batik_madura_test
          DB_USERNAME: postgres
          DB_PASSWORD: password
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: 9. Run Automated Test Suites (PHPUnit)
        run: php artisan test --colors=always

  code-linting:
    name: Code Quality & Pint Formatter Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, iconv

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Laravel Pint (Code Style Linter)
        run: vendor/bin/pint --test

  docker-validation:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Container
        run: docker build -t erp-batik-madura:latest .
