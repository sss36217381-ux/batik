name: Continuous Deployment (CD to VPS)

on:
  workflow_run:
    workflows: ["Laravel ERP Batik Madura CI/CD Pipeline"]
    types:
      - completed
    branches: [ main ]

jobs:
  deploy-staging:
    name: Deploy to Linux VPS Staging Server
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Information Notice
        run: |
          echo "=========================================================="
          echo "CI Pipeline Passed Successfully! Triggering Deployment."
          echo "Target Environment: Linux VPS (PostgreSQL & Docker Ready)"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "=========================================================="

      - name: Deploy via SSH (Simulasi / Eksekusi jika Secret Tersedia)
        if: "${{ env.SSH_HOST != '' }}"
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "Connecting to VPS server and executing pull, migrate, and restart..."
          # ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "cd /var/www/batik && git pull origin main && docker compose up -d --build"
