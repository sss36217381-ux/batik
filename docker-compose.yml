services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_batik_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_batik_madura
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local

